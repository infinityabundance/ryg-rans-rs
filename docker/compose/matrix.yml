# Docker matrix for ryg-rans-rs forensic parity courts
# Requires: RUN_ID and DOCKER_ROOT environment variables
# Usage:
#   export RUN_ID=$(date -u +%Y%m%dT%H%M%S)Z-$(git rev-parse --short HEAD)
#   export DOCKER_ROOT=/run/media/one/toshiba4TB/docker/ryg-rans-rs
#   docker compose --project-name "ryg-rans-rs-court-${RUN_ID}" -f compose/matrix.yml build
#   docker compose --project-name "ryg-rans-rs-court-${RUN_ID}" -f compose/matrix.yml run --rm <service>

services:
  oracle-gcc:
    build:
      context: ${DOCKER_ROOT}/runs/${RUN_ID}/oracle-context
    image: ryg-rans-rs-court-oracle-gcc:${RUN_ID}
    container_name: ryg-rans-rs-court-oracle-gcc-${RUN_ID}
    volumes:
      - type: bind
        source: ${DOCKER_ROOT}/reports/${RUN_ID}/oracle
        target: /reports
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      org.infinityabundance.project: "ryg-rans-rs"
      org.infinityabundance.purpose: "forensic-parity-court"
      org.infinityabundance.managed-by: "ryg-rans-rs-xtask"
      org.infinityabundance.run-id: "${RUN_ID}"
    command: >
      sh -c 'ls -la /usr/local/bin/rans_byte_oracle /usr/local/bin/rans64_oracle /usr/local/bin/rans_alias_oracle /usr/local/bin/rans_sse41_oracle && echo "Oracle build OK"'

  rust-stable-tests:
    build:
      context: ${DOCKER_ROOT}
      dockerfile: dockerfiles/Dockerfile.rust-stable
    image: ryg-rans-rs-court-rust-stable:${RUN_ID}
    container_name: ryg-rans-rs-court-rust-stable-${RUN_ID}
    working_dir: /workspace
    volumes:
      - type: bind
        source: ${DOCKER_ROOT}/source/${RUN_ID}
        target: /workspace
        read_only: true
      - type: volume
        source: cargo-stable
        target: /cargo
      - type: volume
        source: target-stable
        target: /target
      - type: bind
        source: ${DOCKER_ROOT}/reports/${RUN_ID}/stable
        target: /reports
      - type: tmpfs
        target: /tmp
    environment:
      - CARGO_HOME=/cargo
      - CARGO_TARGET_DIR=/target
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      org.infinityabundance.project: "ryg-rans-rs"
      org.infinityabundance.purpose: "forensic-parity-court"
      org.infinityabundance.managed-by: "ryg-rans-rs-xtask"
      org.infinityabundance.run-id: "${RUN_ID}"
    command: >
      sh -c 'cd /workspace && cargo test --workspace 2>&1 && echo "Rust tests OK"'

  rust-musl-build:
    build:
      context: ${DOCKER_ROOT}
      dockerfile: dockerfiles/Dockerfile.rust-musl
    image: ryg-rans-rs-court-rust-musl:${RUN_ID}
    container_name: ryg-rans-rs-court-rust-musl-${RUN_ID}
    working_dir: /workspace
    volumes:
      - type: bind
        source: ${DOCKER_ROOT}/source/${RUN_ID}
        target: /workspace
        read_only: true
      - type: volume
        source: cargo-musl
        target: /cargo
      - type: volume
        source: target-musl
        target: /target
      - type: bind
        source: ${DOCKER_ROOT}/reports/${RUN_ID}/musl
        target: /reports
      - type: tmpfs
        target: /tmp
    environment:
      - CARGO_HOME=/cargo
      - CARGO_TARGET_DIR=/target
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      org.infinityabundance.project: "ryg-rans-rs"
      org.infinityabundance.purpose: "forensic-parity-court"
      org.infinityabundance.managed-by: "ryg-rans-rs-xtask"
      org.infinityabundance.run-id: "${RUN_ID}"
    command: >
      sh -c 'cd /workspace && cargo build --target x86_64-unknown-linux-musl --workspace 2>&1 && echo "Musl build OK"'

  package-audit:
    build:
      context: ${DOCKER_ROOT}
      dockerfile: dockerfiles/Dockerfile.package-audit
    image: ryg-rans-rs-court-package-audit:${RUN_ID}
    container_name: ryg-rans-rs-court-package-audit-${RUN_ID}
    working_dir: /workspace
    volumes:
      - type: bind
        source: ${DOCKER_ROOT}/source/${RUN_ID}
        target: /workspace
        read_only: true
      - type: volume
        source: cargo-stable
        target: /cargo
      - type: volume
        source: target-stable
        target: /target
      - type: bind
        source: ${DOCKER_ROOT}/reports/${RUN_ID}/package
        target: /reports
      - type: tmpfs
        target: /tmp
    environment:
      - CARGO_HOME=/cargo
      - CARGO_TARGET_DIR=/target
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      org.infinityabundance.project: "ryg-rans-rs"
      org.infinityabundance.purpose: "forensic-parity-court"
      org.infinityabundance.managed-by: "ryg-rans-rs-xtask"
      org.infinityabundance.run-id: "${RUN_ID}"
    command: >
      sh -c 'cd /workspace && cargo package --list -p ryg-rans-rs-core 2>&1 && cargo package --list -p ryg-rans-rs 2>&1 && echo "Package audit OK"'

  cross-court:
    build:
      context: ${DOCKER_ROOT}
      dockerfile: dockerfiles/Dockerfile.cross-court
    image: ryg-rans-rs-court-cross-court:${RUN_ID}
    container_name: ryg-rans-rs-court-cross-court-${RUN_ID}
    working_dir: /workspace
    volumes:
      - type: bind
        source: ${DOCKER_ROOT}/source/${RUN_ID}
        target: /workspace
      - type: volume
        source: cargo-stable
        target: /cargo
      - type: volume
        source: target-stable
        target: /target
      - type: bind
        source: ${DOCKER_ROOT}/reports/${RUN_ID}
        target: /reports
      - type: tmpfs
        target: /tmp
    environment:
      - CARGO_HOME=/cargo
      - CARGO_TARGET_DIR=/target
    security_opt:
      - no-new-privileges:true
    labels:
      org.infinityabundance.project: "ryg-rans-rs"
      org.infinityabundance.purpose: "forensic-parity-court"
      org.infinityabundance.managed-by: "ryg-rans-rs-xtask"
      org.infinityabundance.run-id: "${RUN_ID}"
    command: >
      sh -c '
        set -e
        echo "=== Building oracle adapter ==="
        g++ -o /workspace/oracle/adapter/rans_trace /workspace/oracle/adapter/rans_trace.cpp -O3 -lm
        /workspace/oracle/adapter/rans_trace enc-symbol-init 0 10 14
        echo "=== Running cross-decoding court ==="
        cd /workspace && cargo run -p ryg-rans-rs-oracle -- /workspace/oracle/adapter/rans_trace 12 42 20 2>&1
        echo "=== Copying evidence to /reports ==="
        cp -r /workspace/evidence /reports/ 2>/dev/null || true
        echo "=== Cross-court complete ==="
      '

  miri:
    build:
      context: ${DOCKER_ROOT}
      dockerfile: dockerfiles/Dockerfile.miri
    image: ryg-rans-rs-court-miri:${RUN_ID}
    container_name: ryg-rans-rs-court-miri-${RUN_ID}
    working_dir: /workspace
    volumes:
      - type: bind
        source: ${DOCKER_ROOT}/source/${RUN_ID}
        target: /workspace
      - type: volume
        source: cargo-stable
        target: /cargo
      - type: volume
        source: target-stable
        target: /target
      - type: bind
        source: ${DOCKER_ROOT}/reports/${RUN_ID}/miri
        target: /reports
      - type: tmpfs
        target: /tmp
    environment:
      - CARGO_HOME=/cargo
      - CARGO_TARGET_DIR=/target
      - MIRIFLAGS=-Zmiri-disable-isolation
    security_opt:
      - no-new-privileges:true
    labels:
      org.infinityabundance.project: "ryg-rans-rs"
      org.infinityabundance.purpose: "forensic-parity-court"
      org.infinityabundance.managed-by: "ryg-rans-rs-xtask"
      org.infinityabundance.run-id: "${RUN_ID}"
    command: >
      sh -c '
        set -e
        echo "=== Running Miri on core crate ==="
        cd /workspace
        cargo miri test -p ryg-rans-rs-core --no-default-features 2>&1
        echo "=== Miri complete ==="
      '

volumes:
  cargo-stable:
    name: "ryg-rans-rs-cargo-stable-${RUN_ID}"
    labels:
      org.infinityabundance.project: "ryg-rans-rs"
      org.infinityabundance.purpose: "forensic-parity-court"
      org.infinityabundance.run-id: "${RUN_ID}"
  target-stable:
    name: "ryg-rans-rs-target-stable-${RUN_ID}"
    labels:
      org.infinityabundance.project: "ryg-rans-rs"
      org.infinityabundance.purpose: "forensic-parity-court"
      org.infinityabundance.run-id: "${RUN_ID}"
  cargo-musl:
    name: "ryg-rans-rs-cargo-musl-${RUN_ID}"
    labels:
      org.infinityabundance.project: "ryg-rans-rs"
      org.infinityabundance.purpose: "forensic-parity-court"
      org.infinityabundance.run-id: "${RUN_ID}"
  target-musl:
    name: "ryg-rans-rs-target-musl-${RUN_ID}"
    labels:
      org.infinityabundance.project: "ryg-rans-rs"
      org.infinityabundance.purpose: "forensic-parity-court"
      org.infinityabundance.run-id: "${RUN_ID}"
