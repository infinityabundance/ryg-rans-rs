[package]
name = "xtask"
version = "0.1.0"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Build system automation for ryg-rans-rs"

[dependencies]
pico-args = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zstd = { version = "0.13", features = ["experimental"] }
tar = "0.4"
# Public-corpus workload tooling (Phase O.10): sources.toml parsing, safe
# .gz/.zip/.tar.gz extraction for the hash-pinned corpus archives, and
# HTTPS-only downloads (never execute downloaded content).
toml = "0.8"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = { version = "2", features = ["tls"] }
ryg-rans-rs-bench = { path = "../crates/ryg-rans-rs-bench" }
ryg-rans-rs-casefile = { path = "../crates/ryg-rans-rs-casefile", features = ["std"] }
