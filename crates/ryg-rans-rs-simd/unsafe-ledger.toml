file = "lib.rs"
target_features = ["ssse3", "sse4.1"]
safety = "Full 8-way SSE4.1 decode; compressed must have >= 16 u16 words; tables must have 4096 entries; truncation returns Err"
callers = ["backends::decode_interleaved8_sse41_checked", "oracle::rust_word_simd_decode"]

