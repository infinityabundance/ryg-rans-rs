# ryg-rans-rs-simd unsafe-function ledger
#
# This ledger is the machine-readable inventory of every `unsafe fn` in the
# crate.  It is verified against the source by the `ledger_matches_source`
# test in `src/lib.rs` (Phase L.10: "the ledger must not claim all unsafe
# functions are feature-gated unless source inspection proves that
# statement").
#
# Semantics of `target_features`:
#   - A non-empty list must equal the exact `#[target_feature(enable = "...")]`
#     attribute immediately above the function declaration in the source.
#   - `"baseline"` means the function carries no attribute and its body only
#     uses baseline-ISA intrinsics (documented in its # Safety section).
#   - `"delegates"` means the function carries no attribute: it performs no
#     vector instruction itself and calls into an explicitly-gated kernel;
#     its caller contract is documented in its # Safety section.
#   - `"test-only"` marks functions that exist only under `#[cfg(test)]`.
#
# The `safety` field is a short summary; the authoritative contract is the
# `# Safety` section in the source doc comment.

[[unsafe_functions]]
name = "rans_simd_dec_init"
file = "lib.rs"
target_features = ["sse2"]
safety = "Unaligned SSE2 16-byte load of 8 u16 initial states; length-checked (None on truncation); baseline x86_64"
callers = ["simd_decode_inner"]

[[unsafe_functions]]
name = "rans_simd_dec_sym_unchecked"
file = "lib.rs"
target_features = ["sse4.1"]
safety = "4-lane symbol decode + state advance; slot indices masked to 4095; tables must have 4096 entries"
callers = ["simd_decode_inner"]

[[unsafe_functions]]
name = "rans_simd_dec_renorm_unchecked"
file = "lib.rs"
target_features = ["ssse3", "sse4.1"]
safety = "4-lane renorm via signed-compare bias; words copied to scratch before load (no over-read); length-checked (None on truncation); aligned SHUFFLE_MASKS static"
callers = ["simd_decode_inner"]

[[unsafe_functions]]
