[package]
name = "ryg-rans-rs"
version = "0.1.0"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Public facade for rANS entropy coding with safe API"

[dependencies]
ryg-rans-rs-core = { path = "../ryg-rans-rs-core" }
ryg-rans-rs-simd = { path = "../ryg-rans-rs-simd", optional = true }

[features]
default = ["simd"]
simd = ["ryg-rans-rs-simd"]
alloc = ["ryg-rans-rs-core/alloc"]
