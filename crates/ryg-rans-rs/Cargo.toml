[package]
name = "ryg-rans-rs"
version = "0.1.15"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Public facade for rANS entropy coding with safe API — re-exports core types, optional SIMD acceleration"

[dependencies]
ryg-rans-rs-core = { version = "0.1.6", path = "../ryg-rans-rs-core" }
ryg-rans-rs-simd = { version = "0.1.6", path = "../ryg-rans-rs-simd", optional = true }

[features]
default = []
simd = ["dep:ryg-rans-rs-simd"]
alloc = ["ryg-rans-rs-core/alloc"]
