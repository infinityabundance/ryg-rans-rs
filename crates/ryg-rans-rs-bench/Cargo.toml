[package]
name = "ryg-rans-rs-bench"
version = "0.2.0"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Criterion benchmark suite for all ryg-rans-rs execution tiers"
publish = false

[dependencies]
ryg-rans-rs-simd = { workspace = true, features = ["std"] }
ryg-rans-rs-parallel = { workspace = true }
ryg-rans-rs-core = { workspace = true, features = ["std", "alloc"] }
criterion = { workspace = true }
sha2 = "0.10"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Phase L.14 comparative court: maintained FFI bindings to upstream ryg_rans
# (https://github.com/m4tx/ryg-rans-sys), pinned to the exact version.
ryg-rans-sys = { version = "=1.2.0", features = ["byte", "64"] }

[features]
# The upstream word_sse41 FFI surface requires SSE4.1 to be compiled in
# (its build script checks target_feature).  Enable this feature (under
# RUSTFLAGS="-C target-cpu=native") to include the word-rANS C comparison.
comparative-word-sse41 = ["ryg-rans-sys/word_sse41"]

[[bench]]
name = "scalar"
harness = false

[[bench]]
name = "sse41"
harness = false

[[bench]]
name = "avx2"
harness = false

[[bench]]
name = "avx512"
harness = false

[[bench]]
name = "specialized"
harness = false

[[bench]]
name = "batch"
harness = false

[[bench]]
name = "parallel"
harness = false

[[bench]]
name = "parallel_l17"
harness = false

[[bench]]
name = "container"
harness = false

[[bench]]
name = "dispatch"
harness = false

[[bench]]
name = "byte_rans"
harness = false

[[bench]]
name = "r64"
harness = false

[[bench]]
name = "alias"
harness = false

[[bench]]
name = "comparative"
harness = false
