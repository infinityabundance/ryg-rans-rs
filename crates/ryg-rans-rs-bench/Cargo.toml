[package]
name = "ryg-rans-rs-bench"
version = "0.4.1"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Criterion benchmark suite for all ryg-rans-rs execution tiers"
publish = false

[dependencies]
ryg-rans-rs-simd = { workspace = true, features = ["std"] }
# `cache-timing` exposes the O.16 contention instrumentation (lock wait,
# single-flight wait, build time) and the invariant/retained-entry surface
# the courts and the mode-proofing bench rely on.  It is a bench-crate-only
# enablement: production consumers never get the timing atomics.
ryg-rans-rs-parallel = { workspace = true, features = ["cache-timing"] }
ryg-rans-rs-core = { workspace = true, features = ["std", "alloc"] }
ryg-rans-rs-casefile = { version = "0.4.1", path = "../ryg-rans-rs-casefile", features = ["std"] }
criterion = { workspace = true }
sha2 = "0.10"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tar = "0.4"
zstd = { version = "0.13", features = ["experimental"] }
# Phase L.14 comparative court: maintained FFI bindings to upstream ryg_rans
# (https://github.com/m4tx/ryg-rans-sys), pinned to the exact version.
#
# Optional: the comparative bench is the ONLY consumer, and pulling it into
# every build forces the bindgen build-script (which needs libclang) into
# toolchains that must stay lean — musl, MSRV, and cross-compile matrix
# jobs.  The `comparative` feature keeps those builds free of the FFI
# toolchain while the `comparative` bench target (required-features) still
# compiles and runs exactly as before when the feature is enabled.
ryg-rans-sys = { version = "=1.2.0", features = ["byte", "64"], optional = true }

[features]
# The upstream word_sse41 FFI surface requires SSE4.1 to be compiled in
# (its build script checks target_feature).  Enable this feature (under
# RUSTFLAGS="-C target-cpu=native") to include the word-rANS C comparison.
comparative-word-sse41 = ["ryg-rans-sys/word_sse41"]
# Enables the FFI comparative court (bindgen/libclang build dependency).
comparative = ["dep:ryg-rans-sys"]

[[bench]]
name = "scalar"
harness = false

[[bench]]
name = "sse41"
harness = false

[[bench]]
name = "avx2"
harness = false

[[bench]]
name = "avx512"
harness = false

[[bench]]
name = "specialized"
harness = false

[[bench]]
name = "batch"
harness = false

[[bench]]
name = "parallel"
harness = false

[[bench]]
name = "parallel_l17"
harness = false

[[bench]]
name = "container"
harness = false

[[bench]]
name = "dispatch"
harness = false

[[bench]]
name = "model_cache"
harness = false

[[bench]]
name = "byte_rans"
harness = false

[[bench]]
name = "r64"
harness = false

[[bench]]
name = "alias"
harness = false

[[bench]]
name = "comparative"
harness = false
required-features = ["comparative"]
