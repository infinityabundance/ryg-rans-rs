[package]
name = "ryg-rans-rs-cli"
version = "0.1.15"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Production-grade CLI for rANS entropy coding — encode, decode, inspect, verify, compare, benchmark"

[[bin]]
name = "ryg-rans"
path = "src/main.rs"

[dependencies]
ryg-rans-rs = { version = "0.1.6", path = "../ryg-rans-rs" }
ryg-rans-rs-core = { version = "0.1.6", path = "../ryg-rans-rs-core", features = ["std"] }
ryg-rans-rs-simd = { version = "0.1.10", path = "../ryg-rans-rs-simd", optional = true }
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[features]
default = ["simd"]
simd = ["ryg-rans-rs-simd"]
