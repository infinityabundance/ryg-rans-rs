[package]
name = "ryg-rans-rs-cli"
version = "0.5.1"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "ryg-rans CLI for rANS entropy coding — encode, decode, inspect, verify, compare, benchmark"

[[bin]]
name = "ryg-rans"
path = "src/main.rs"

[dependencies]
ryg-rans-rs = { version = "0.5.1", path = "../ryg-rans-rs" }
ryg-rans-rs-core = { version = "0.5.1", path = "../ryg-rans-rs-core", features = ["std"] }
ryg-rans-rs-simd = { version = "0.5.1", path = "../ryg-rans-rs-simd", optional = true }
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
# Signal handlers (SIGINT/SIGTERM) for cooperative CLI cancellation — L3-D.
# Unix-only; the no-FFI gate covers the facade crate, not the CLI binary.
libc = { version = "0.2", optional = true }

[features]
default = ["simd", "signals"]
simd = ["ryg-rans-rs-simd"]
# Installs SIGINT/SIGTERM handlers on Unix.  Disabling leaves the CLI
# cancellable via --timeout only (timeout is pure std).
signals = ["dep:libc"]

[dev-dependencies]
proptest = "1"
# SIGINT delivery in the cancellation integration test (unix).
libc = "0.2"
