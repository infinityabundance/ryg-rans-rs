[package]
name = "ryg-rans-rs-parallel"
version = "0.1.23"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Deterministic parallel block engine for rANS entropy coding — bounded, cancellable, thread-count-independent output"

[dependencies]
ryg-rans-rs-core = { version = "0.1.23", path = "../ryg-rans-rs-core", features = ["alloc"] }
ryg-rans-rs = { version = "0.1.23", path = "../ryg-rans-rs", default-features = false, features = ["alloc"], optional = true }
ryg-rans-rs-simd = { version = "0.1.23", path = "../ryg-rans-rs-simd", features = ["std"], optional = true }
crossbeam-channel = { version = "0.5", features = ["std"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["simd"]
simd = ["ryg-rans-rs-simd"]
