[package]
name = "ryg-rans-rs-parallel"
version = "0.1.30"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Deterministic parallel block engine for rANS entropy coding — bounded, cancellable, thread-count-independent output"

[dependencies]
ryg-rans-rs-core = { version = "0.1.30", path = "../ryg-rans-rs-core", features = ["alloc"] }
ryg-rans-rs = { version = "0.1.30", path = "../ryg-rans-rs", default-features = false, features = ["alloc"], optional = true }
ryg-rans-rs-simd = { version = "0.1.30", path = "../ryg-rans-rs-simd", features = ["std"], optional = true }
crossbeam-channel = { version = "0.5", features = ["std"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = { version = "0.2", optional = true }

[features]
default = ["simd"]
simd = ["ryg-rans-rs-simd"]
# Enables Linux sched_setaffinity worker pinning (requires unsafe libc calls).
# Off by default to preserve #![forbid(unsafe_code)] in default builds.
affinity = ["dep:libc"]

[lints.rust]
# `loom` is a rustc cfg flag (not a cargo feature) used by tests/loom_tests.rs:
# RUSTFLAGS="--cfg loom" cargo test --release
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }
