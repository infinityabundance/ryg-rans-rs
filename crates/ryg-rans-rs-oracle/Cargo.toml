[package]
name = "ryg-rans-rs-oracle"
version = "0.1.6"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Oracle harness for comparing Rust rANS against compiled C/C++ — generates court receipts and residuals"

[dependencies]
ryg-rans-rs-core = { version = "0.1.6", path = "../ryg-rans-rs-core" }
ryg-rans-rs-casefile = { version = "0.1.6", path = "../ryg-rans-rs-casefile" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
