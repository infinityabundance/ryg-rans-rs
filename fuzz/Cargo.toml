[package]
name = "ryg-rans-rs-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.ryg-rans-rs-core]
path = "../crates/ryg-rans-rs-core"
features = ["alloc"]

[dependencies.ryg-rans-rs-simd]
path = "../crates/ryg-rans-rs-simd"
features = ["std"]

[dependencies.ryg-rans-rs-parallel]
path = "../crates/ryg-rans-rs-parallel"

[[bin]]
name = "byte_rans_roundtrip"
path = "fuzz_targets/byte_rans_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "r64_rans_roundtrip"
path = "fuzz_targets/r64_rans_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "word_rans_roundtrip"
path = "fuzz_targets/word_rans_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "malformed_byte"
path = "fuzz_targets/malformed_byte.rs"
test = false
doc = false
bench = false

[[bin]]
name = "alias_roundtrip"
path = "fuzz_targets/alias_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "avx512vl8_roundtrip"
path = "fuzz_targets/avx512vl8_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "avx512_16way_roundtrip"
path = "fuzz_targets/avx512_16way_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parallel_block_plan"
path = "fuzz_targets/parallel_block_plan.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parallel_reorder"
path = "fuzz_targets/parallel_reorder.rs"
test = false
doc = false
bench = false
