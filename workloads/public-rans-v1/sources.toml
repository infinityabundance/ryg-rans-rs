# Public rANS Workload v1 — source records
#
# Every source record pins: the official source page, the exact download
# URL, the owner, the usage/license statement, the redistribution status,
# and the expected hashes (archive + extracted files) in
# `expected-source-hashes.json`.
#
# Retrieval date: 2026-08-02 (all records).
#
# Hash provenance:
#   - enwik8/enwik9: cross-validated against the publisher's published MD5
#     and SHA-1 (https://mattmahoney.net/dc/textdata.html) — byte-identical.
#   - All other sources: SHA-256 measured at retrieval from the official
#     endpoints below; the measurement is recorded here and the fetch tool
#     re-verifies every archive against these values on every run.

[workload]
name = "public-rans-v1"
version = "1"
schema = "workload-manifest.schema.json"

# ---------------------------------------------------------------------------
# Canterbury family (https://corpus.canterbury.ac.nz)
# ---------------------------------------------------------------------------

[[source]]
id = "canterbury-standard"
family = "canterbury"
purpose = "heterogeneous small files: text, source, spreadsheet, fax (ptt5), binary (sum)"
official_page = "https://corpus.canterbury.ac.nz/descriptions/#cantrbry"
url = "https://corpus.canterbury.ac.nz/resources/cantrbry.zip"
owner = "Canterbury Corpus project (University of Canterbury; Ross Arnold, Tim Bell)"
license = "free for research and evaluation; see https://corpus.canterbury.ac.nz/faq.html"
redistribution = "permitted (public corpus; no redistribution restriction stated)"
retrieval_date = "2026-08-02"
extraction = "zip"

[[source]]
